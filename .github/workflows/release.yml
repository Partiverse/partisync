# Release 发布工作流（SPEC docs/specs/M8-WP02.md §2.4）。
# 签名工具链与密钥保管：ADR-0027（草稿——签名步在其批准后启用）+
# docs/release/key-custody.md（私钥仅以 GitHub secret 注入，人不经手）。
# 门禁阈值改动需 ADR（铁律：门禁前置）；toolchain 与 rust-toolchain.toml 一致（ADR-0003）。
name: release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-cli-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: build (locked, auditable)
        run: |
          cargo install --locked cargo-auditable
          cargo auditable build --locked --release -p partisync-cli -p partisync-hub
      - name: package
        # hub 产物 = hub-demo-web（hub crate 无主 bin——v0.1.0-alpha 口径，
        # 正式 hub 服务 bin 归后续任务；release-report 登记）
        run: |
          mkdir -p dist
          for bin in partisync-cli hub-demo-web; do
            cp target/release/$bin dist/
          done
          tar -czf dist/partisync-linux-x86_64.tar.gz -C dist partisync-cli hub-demo-web
      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux
          path: dist/partisync-linux-x86_64.tar.gz

  build-cli-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: build (locked, auditable)
        run: |
          cargo install --locked cargo-auditable
          cargo auditable build --locked --release -p partisync-cli
      - name: package
        run: |
          mkdir -p dist
          cp target/release/partisync-cli dist/
          tar -czf dist/partisync-cli-macos-aarch64.tar.gz -C dist partisync-cli
      - uses: actions/upload-artifact@v4
        with:
          name: cli-macos
          path: dist/partisync-cli-macos-aarch64.tar.gz

  build-desktop-macos:
    # 桌面壳 dmg（Tauri bundler）。公证（notarization）为 SPEC 非目标，
    # 触发条件登记后另行处置（README 标注绕过方式）。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: build dmg
        # tauri-cli 不接受 --locked（Cargo.lock 已入库，依赖由 lock 钉住）
        run: |
          cargo install tauri-cli --locked
          cargo tauri build --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  release:
    needs: [build-cli-linux, build-cli-macos, build-desktop-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: checksums
        run: |
          cd dist
          find . -type f \( -name "*.tar.gz" -o -name "*.dmg" \) -exec sha256sum {} \; | sed 's| \./| |' > SHA256SUMS
      # 签名步（M8-WP02-T02，ADR-0027 已接受 + 生成仪式 2026-10-01 完成）：
      # 依赖 GitHub secrets RELEASE_SIGNING_KEY（口令加密私钥）与
      # RELEASE_SIGNING_PASSWORD（口令，见 key-custody.md「CI 签名口径」节）。
      # secret 未配置时跳过签名——Release 显式标注 unsigned（不假绿）。
      - name: install minisign
        if: env.RELEASE_SIGNING_KEY != ''
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        # crates.io 的 minisign crate 是纯库（v0.10 无 binaries）——CLI 从官方仓库装
        run: cargo install --git https://github.com/jedisct1/minisign.git --tag v0.11.0 minisign
      - name: sign artifacts
        if: env.RELEASE_SIGNING_KEY != ''
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
          MINISIGN_PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
        run: |
          cd dist
          printf '%s\n' "$RELEASE_SIGNING_KEY" > /tmp/release.key
          trap 'rm -f /tmp/release.key' EXIT
          # dmg 名含空格（"PartiSync Desktop_*"）——find -print0 防拆词
          find . -maxdepth 1 \( -name "*.tar.gz" -o -name "*.dmg" -o -name "SHA256SUMS" \) -print0 |
            while IFS= read -r -d '' f; do
              minisign -Sm "$f" -s /tmp/release.key \
                -t "PartiSync release ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            done
      - name: draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/**/*.tar.gz
            dist/**/*.dmg
            dist/SHA256SUMS
            dist/**/*.minisig
