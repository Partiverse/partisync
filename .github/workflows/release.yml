# Release 发布工作流（SPEC docs/specs/M8-WP02.md §2.4；beta 修订 docs/specs/M9-WP06.md §2.1 T02）。
# 签名工具链与密钥保管：ADR-0027 + docs/release/key-custody.md（私钥仅以
# GitHub secret 注入，人不经手）。门禁阈值改动需 ADR；toolchain 与
# rust-toolchain.toml 一致（ADR-0003）。
# rc 口径（M10-WP06-T02 落档、M11-WP01-T01 用户 2026-10-10 确认）：tag
# v0.2.0-rc.1、workspace 0.2.0（整数版）、产物名 -rc.1 后缀；五 bin 入包
# （新增 partisync-mcp-http）；打包前 strip（改进项 a）；CycloneDX SBOM
# 独立导出；linux 双构建 reproducibility 对账 + CARGO_PROFILE_RELEASE_
# DEBUG=false 联动评估（改进项 b，偏差登记不假绿）；桌面 dmg 随发（§4-2b）。
name: release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-cli-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: build (locked, auditable)
        run: |
          cargo install --locked cargo-auditable
          cargo auditable build --locked --release -p partisync-cli -p partisync-hub -p partisync-gateway -p partisync-fuse
      - name: package (strip first — rc 改进项 a，cadence §2.2)
        # hub 产物 = hub-demo-web（hub crate 无主 bin——alpha 口径延续，如实
        # 标注 demo 面）；rc 扩 partisync-mcp-http（MCP 2.0 远程入口，
        # M10-WP05）——五 bin 口径
        run: |
          mkdir -p dist
          for bin in partisync-cli partisync-mcp partisync-mcp-http partisync-fuse hub-demo-web; do
            strip -s target/release/$bin
            cp target/release/$bin dist/
          done
          tar -czf dist/partisync-cli-0.2.0-rc.1-linux-x86_64.tar.gz -C dist \
            partisync-cli partisync-mcp partisync-mcp-http partisync-fuse hub-demo-web
      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux
          path: dist/partisync-cli-0.2.0-rc.1-linux-x86_64.tar.gz

  build-cli-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: build (locked, auditable)
        # macOS 不含 partisync-fuse：fuser 需 osxfuse 系统件（runner 未预装，
        # 构建必败）——fuse 产物登记 linux-only，macOS 挂载路径作为已知限制
        # 写入 release notes（SPEC §2.1 产物面轴偏差，发布报告留痕）
        run: |
          cargo install --locked cargo-auditable
          cargo auditable build --locked --release -p partisync-cli -p partisync-gateway
      - name: package (strip first — rc 改进项 a)
        run: |
          mkdir -p dist
          for bin in partisync-cli partisync-mcp partisync-mcp-http; do
            strip -s target/release/$bin
            cp target/release/$bin dist/
          done
          tar -czf dist/partisync-cli-0.2.0-rc.1-macos-aarch64.tar.gz -C dist \
            partisync-cli partisync-mcp partisync-mcp-http
      - uses: actions/upload-artifact@v4
        with:
          name: cli-macos
          path: dist/partisync-cli-0.2.0-rc.1-macos-aarch64.tar.gz

  build-desktop-macos:
    # 桌面壳 dmg（Tauri bundler）。公证（notarization）为 SPEC 非目标，
    # 触发条件登记后另行处置（README 标注绕过方式）。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: build dmg
        # tauri-cli 不接受 --locked（Cargo.lock 已入库，依赖由 lock 钉住）
        run: |
          cargo install tauri-cli --locked
          cargo tauri build --target aarch64-apple-darwin
      - name: rename (rc.1 suffix)
        run: |
          mkdir -p dist
          for f in target/aarch64-apple-darwin/release/bundle/dmg/*.dmg; do
            base=$(basename "$f")
            cp "$f" "dist/PartiSync.Desktop_0.2.0-rc.1_aarch64.dmg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: dist/PartiSync.Desktop_0.2.0-rc.1_aarch64.dmg

  sbom:
    # CycloneDX SBOM 独立导出（M9-WP06 §2.1；A6 cargo auditable 嵌入面之外的
    # 独立机器可读清单）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: export SBOM
        run: |
          cargo install --locked cargo-cyclonedx
          cargo cyclonedx --all --format json
      - name: collect
        run: |
          mkdir -p dist
          find . -name "*.cdx.json" -not -path "./target/*" -exec cp {} dist/ \;
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/*.cdx.json

  reproducibility:
    # linux 双构建 SHA256 对账（M8-WP02 R1 判例：偏差登记不假绿）——
    # cargo 构建含路径相关性，不一致时输出偏差说明进产物，不作失败门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: build twice (separate target dirs; rc 改进项 b 评估——无 debug info 干扰)
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "false"
        run: |
          CARGO_TARGET_DIR=target-a cargo build --locked --release -p partisync-cli
          CARGO_TARGET_DIR=target-b cargo build --locked --release -p partisync-cli
      - name: compare
        run: |
          A=$(sha256sum target-a/release/partisync-cli | cut -d' ' -f1)
          B=$(sha256sum target-b/release/partisync-cli | cut -d' ' -f1)
          echo "build-a: $A"
          echo "build-b: $B"
          if [ "$A" = "$B" ]; then
            echo "REPRODUCIBLE=yes" | tee reproducibility.txt
          else
            echo "REPRODUCIBLE=no" | tee reproducibility.txt
            echo "deviation: cargo 构建路径相关性（M8-WP02 R1 判例，偏差登记不假绿）" | tee -a reproducibility.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: reproducibility
          path: reproducibility.txt

  release:
    needs: [build-cli-linux, build-cli-macos, build-desktop-macos, sbom, reproducibility]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: flatten + checksums
        # 剥掉 artifact 子目录前缀——Release asset 为扁平布局，sha256sum -c
        # 需与文件名直接对应
        run: |
          cd dist
          find . -type f \( -name "*.tar.gz" -o -name "*.dmg" \) -print0 |
            while IFS= read -r -d '' f; do
              dir=$(dirname "$f"); base=$(basename "$f")
              mv "$f" "$base"
              sha256sum "$base" >> SHA256SUMS
            done
          find . -mindepth 2 -type f \( -name "*.cdx.json" -o -name "reproducibility.txt" \) -exec mv {} . \;
          rm -rf */ 2>/dev/null || true
          ls -la
      # 签名步（M8-WP02-T02，ADR-0027 已接受 + 生成仪式 2026-10-01 完成）：
      # 依赖 GitHub secrets RELEASE_SIGNING_CI_KEY（无口令 CI 子钥）。
      # secret 未配置时跳过签名——Release 显式标注 unsigned（不假绿）。
      - name: install minisign
        if: env.RELEASE_SIGNING_CI_KEY != ''
        env:
          RELEASE_SIGNING_CI_KEY: ${{ secrets.RELEASE_SIGNING_CI_KEY }}
        run: |
          curl -sL https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz | tar xz
          sudo install minisign-linux/x86_64/minisign /usr/local/bin/minisign
          minisign -v
      - name: sign artifacts
        if: env.RELEASE_SIGNING_CI_KEY != ''
        env:
          RELEASE_SIGNING_CI_KEY: ${{ secrets.RELEASE_SIGNING_CI_KEY }}
        run: |
          cd dist
          printf '%s\n' "$RELEASE_SIGNING_CI_KEY" > /tmp/ci.key
          trap 'rm -f /tmp/ci.key' EXIT
          # dmg 名含空格（"PartiSync Desktop_*"）——find -print0 防拆词
          find . \( -name "*.tar.gz" -o -name "*.dmg" -o -name "SHA256SUMS" -o -name "*.cdx.json" \) -print0 |
            while IFS= read -r -d '' f; do
              minisign -Sm "$f" -s /tmp/ci.key \
                -t "PartiSync release (CI subkey; $(date -u +%Y-%m-%dT%H:%M:%SZ))"
            done
      - name: draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/**/*.tar.gz
            dist/**/*.dmg
            dist/SHA256SUMS
            dist/**/*.minisig
            dist/*.cdx.json
            dist/reproducibility.txt
