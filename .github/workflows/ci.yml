# CI 门禁（SPEC docs/specs/M-1-WP02.md）。
# 阈值改动需 ADR（铁律：门禁前置）。夜间套件（混沌/互操作/模糊）随对应里程碑落地。
# 工具链版本与 rust-toolchain.toml 保持一致（ADR-0003：1.94.0）。
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Tauri 2 Linux 系统库（ADR-0024 amend， 修订 3）：
      # ubuntu-latest runner 不默认带 webkit2gtk-4.1（2026-Q3 起 GitHub Actions
      # runner image 已剥离系统级 webview 依赖）， glib-sys / gtk-rs build script
      # 会因 pkg-config 找不到 glib-2.0 失败。装上 Tauri 官方推荐全套后，
      # desktop crate 编译通过； macOS runner 不需要（自带 WKWebView）。
      - name: install Tauri 2 Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      # 同 clippy job， ubuntu runner 上 desktop crate 编译需 Tauri 2 Linux
      # 系统库（ADR-0024 amend 修订 3）； macOS runner 自带 WKWebView 无影响。
      - name: install Tauri 2 Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - run: cargo test --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # deny action 的内置镜像不含 rust-toolchain.toml 钉的 1.94.0
      #（2026-09-30 三连失败：override toolchain not installed）——
      # 与 nightly 同款先装 toolchain；不改变任何门禁阈值
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: EmbarkStudios/cargo-deny-action@v2

  # 互操作认证矩阵（SPEC M1-WP08）：rclone S3/WebDAV + 消费面 + 跨协议。
  # D10（CI 计费闸门）解除后本 job 自动生效。
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone curl
      - run: cargo build -q -p partisync-cli
      - run: scripts/interop.sh

  # 铁律 2（追溯唯一）：PR 中每个非合并提交必须携带合规 Task-ID trailer。
  task-ids:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-task-ids.sh origin/${{ github.base_ref }} HEAD
