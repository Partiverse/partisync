# cargo-deny 配置（执行方案 §5.1 依赖治理）。
# 许可证白名单：与调研方案 §6 选型兼容；新增条目需 ADR。

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD", # ADR-0011：varint-rs（fjall 传递依赖）
    "BSL-1.0", # ADR-0011：xxhash-rust（fjall 传递依赖）
    "CDLA-Permissive-2.0", # ADR-0012：webpki-root-certs（rustls-platform-verifier 链）
    "Unlicense", # ADR-0016：async_io_stream/pharos/ws_stream_wasm（iroh-blobs wasm 链）
    "MPL-2.0", # ADR-0016：attohttpc（iroh-blobs 链，文件级 copyleft）
    "NCSA", # ADR-0017：libfuzzer-sys（image→ravif→rav1e AVIF 路径；OSI/FSF 认可，BSD-3 同族）
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "deny"
# ADR-0014（2026-09-21 附注）：reed-solomon-erasure v6 锁 parking_lot v0.11 → instant v0.1.13
# unmaintained，无已知漏洞；等上游升 parking_lot ≥ 0.12 后撤销本豁免。
# ADR-0016（2026-09-21）：iroh/iroh-blobs 传递链 unmaintained 三条——
# atomic-polyfill(heapless→postcard)、paste(netdev→iroh)、proc-macro-error(genawaiter→bao-tree)；
# 均无已知漏洞、无安全升级路径，上游切换后撤销。
# ADR-0021（2026-09-25）：aws-smithy-http-client 1.4.2 双栈 HTTP 客户端拉
# hyper 0.14 → h2 0.3.27、rustls 0.21 → webpki 0.101.7 旧 major 线四条公告
# （RUSTSEC-2026-0258 h2 空 DATA 帧[官方 Low]、0098/0099 webpki 名约束、
# 0104 webpki CRL panic）。可达性论证：本仓库经 AWS SDK 仅作出站客户端
# （SQS ReceiveMessage/Delete），h2 空帧排队是对端接收行为不可达；webpki
# 校验对象限 AWS 信任根端点（无恶意 CA 名约束/CRL 输入面）。无修复版本
# （0.3/0.101 线 EOL）；撤销条件 = aws-smithy-http-client 弃用 hyper 0.14
# 双栈或发布修复传递版。
# ADR-0020（2026-09-22）：RUSTSEC-2023-0071 rsa Marvin Attack（PKCS#1 v1.5 解密
# 时序侧信道，私钥运算）——本仓库经 c2pa 仅做签名**验证**（公钥运算），不可达；
# 上游 RustCrypto #626 立场：无修复版本。撤销条件 = rsa 发布修复版或 c2pa 弃用 rsa。
ignore = [
    "RUSTSEC-2024-0384", # ADR-0014
    "RUSTSEC-2023-0089", # ADR-0016
    "RUSTSEC-2024-0436", # ADR-0016
    "RUSTSEC-2024-0370", # ADR-0016
    "RUSTSEC-2023-0071", # ADR-0020
    "RUSTSEC-2026-0258", # ADR-0021（h2 0.3 双栈，见上注）
    "RUSTSEC-2026-0098", # ADR-0021（webpki 0.101 双栈）
    "RUSTSEC-2026-0099", # ADR-0021（webpki 0.101 双栈）
    "RUSTSEC-2026-0104", # ADR-0021（webpki 0.101 双栈）
]
