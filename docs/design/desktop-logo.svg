<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- PartiSync 文字 logo 图标（设计语言 v4.3：borg 暗底 × 赛博朋克 × 等宽直角）
       主体 = "P"（Menlo Bold，荧光绿渐变 + glow）+ 尾部光标块（终端提示符隐喻）
       底 = 暗黑 + 网格 + 星点 + 中央绿核（微观宇宙） -->
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230"/>
    </clipPath>
    <radialGradient id="core" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="hsl(152,60%,30%)" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="hsl(152,60%,25%)" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="hsl(152,60%,25%)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="psfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#35e856"/>
      <stop offset="100%" stop-color="#189f38"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 暗底 squircle -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="#020503"/>

  <g clip-path="url(#squircle)">
    <!-- 中央绿核 -->
    <rect width="1024" height="1024" fill="url(#core)"/>

    <!-- 网格 32px（绿 4.5%） -->
    <g stroke="rgba(34,208,69,0.045)" stroke-width="1">
      <path d="M0 64H1024M0 96H1024M0 128H1024M0 160H1024M0 192H1024M0 224H1024M0 256H1024M0 288H1024M0 320H1024M0 352H1024M0 384H1024M0 416H1024M0 448H1024M0 480H1024M0 512H1024M0 544H1024M0 576H1024M0 608H1024M0 640H1024M0 672H1024M0 704H1024M0 736H1024M0 768H1024M0 800H1024M0 832H1024M0 864H1024M0 896H1024M0 928H1024M0 960H1024"/>
      <path d="M64 0V1024M96 0V1024M128 0V1024M160 0V1024M192 0V1024M224 0V1024M256 0V1024M288 0V1024M320 0V1024M352 0V1024M384 0V1024M416 0V1024M448 0V1024M480 0V1024M512 0V1024M544 0V1024M576 0V1024M608 0V1024M640 0V1024M672 0V1024M704 0V1024M736 0V1024M768 0V1024M800 0V1024M832 0V1024M864 0V1024M896 0V1024M928 0V1024M960 0V1024"/>
    </g>

    <!-- 星点（微观宇宙粒子） -->
    <g fill="hsl(152,70%,70%)">
      <circle cx="120" cy="110" r="3" opacity="0.8"/>
      <circle cx="300" cy="70" r="2" opacity="0.6"/>
      <circle cx="760" cy="90" r="2.5" opacity="0.7"/>
      <circle cx="905" cy="180" r="2" opacity="0.5"/>
      <circle cx="880" cy="600" r="3" opacity="0.55"/>
      <circle cx="930" cy="840" r="2" opacity="0.5"/>
      <circle cx="140" cy="680" r="2.5" opacity="0.6"/>
      <circle cx="90" cy="880" r="3" opacity="0.7"/>
      <circle cx="480" cy="110" r="2" opacity="0.5"/>
      <circle cx="620" cy="66" r="2" opacity="0.6"/>
      <circle cx="860" cy="930" r="2" opacity="0.4"/>
    </g>
    <g fill="hsl(45,70%,65%)">
      <circle cx="210" cy="190" r="2.5" opacity="0.4"/>
      <circle cx="855" cy="380" r="2" opacity="0.35"/>
      <circle cx="170" cy="470" r="2" opacity="0.3"/>
    </g>
    <g fill="hsl(315,40%,70%)">
      <circle cx="700" cy="150" r="2" opacity="0.35"/>
      <circle cx="115" cy="360" r="2" opacity="0.3"/>
    </g>

    <!-- 主体 "P"：Menlo Bold（系统等宽），荧光绿渐变 + glow -->
    <text x="292" y="742" font-family="Menlo, 'Menlo Regular', monospace" font-weight="bold"
          font-size="660" fill="url(#psfade)" filter="url(#glow)">P</text>

    <!-- 尾部光标块（终端提示符隐喻；呼吸感静态化） -->
    <rect x="712" y="598" width="86" height="144" fill="#22D045" opacity="0.92" filter="url(#glow)"/>

    <!-- 边框（panel-line） -->
    <rect x="3" y="3" width="1018" height="1018" rx="227" ry="227" fill="none" stroke="rgba(34,208,69,0.35)" stroke-width="6"/>
  </g>
</svg>
