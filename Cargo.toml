[workspace]
resolver = "2"
members = [
    "crates/partisync-core",
    "crates/partisync-graph",
    "crates/partisync-cas",
    "crates/partisync-provider",
    "crates/partisync-transfer",
    "crates/partisync-sync",
    "crates/partisync-index",
    "crates/partisync-ai",
    "crates/partisync-gateway",
    "crates/partisync-hub",
    "crates/partisd",
    "crates/partisync-cli",
    "crates/partisync-desktop", # ADR-0024（M6-WP03 桌面壳骨架）
    "crates/partisync-ext-host", # ADR-0025（M7-WP01 WASM 扩展宿主）
    "crates/partisync-fuse",     # ADR-0026（M8-WP01 FUSE 挂载面一期）
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://example.invalid/partisync" # 占位：仓库远端待定（ADR-0000）

[workspace.dependencies]
proptest = "1"
getrandom = "0.2" # ADR-0001
criterion = "0.8" # SPEC M0-WP00（D2 基准基建）
# ADR-0002（M0 元数据批次） + M6-WP03-T05 增 process feature（tokio::process::Command 异步子进程） + M9-WP01-T01 增 time feature（装配层 bisync tick interval）
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "process", "time"] }
axum = "0.8"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
blake3 = "1.8"
md-5 = "0.10"
http = "1" # ADR-0006 伴生：HttpTransport 签名用
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] } # ADR-0006：自研 OpenDAL HTTP 传输（绕过 0.59.2 打包缺陷）
futures = "0.3" # ADR-0006：S3 ETag（rclone 互操作口径）
fastcdc = "5.0" # ADR-0004（M0-WP03 内容定义分块）
notify = "8.2" # ADR-0005（M0-WP04 文件事件源）
opendal = { version = "0.59", default-features = false, features = ["services-s3", "services-webdav", "services-fs", "http-transport-reqwest"] } # ADR-0006（M1-WP01 Provider SPI）
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fjall = "3.1" # ADR-0011（M3-WP01 Hub L1 元数据 LSM）
openraft = { version = "0.9", features = ["serde", "storage-v2"] } # ADR-0013（M3-WP02 分片复制共识；storage-v2=裁定 2 存储面）
# ADR-0017（M4-WP01 Sidecar 推理与图像栈批次）：重推理栈 feature 门控默认关
image = "0.25"
# M4-WP02 混合检索（调研方案 §5.10 锚定版本）
tantivy = "0.26"       # BM25 全文索引
usearch = "2.26"       # HNSW 向量索引（调研方案 §8 表）
byteorder = "1.5"      # 向量文件二进制解析（writer.rs）
async-trait = "0.1"    # async trait object（writer.rs SidecarReader/GraphReader trait）
dirs = "5"             # 默认索引路径解析（engine.rs）
# ADR-0018（M4-WP02 bge-reranker/fastembed 推理批次，feature 门控默认关）
fastembed = "=7.0.1" # ai-embed/ai-rerank feature（与 ADR-0017 同版本锚定）
kamadak-exif = "0.6"
ort = "=2.0.0-rc.13" # ai-ocr feature（rc 版本精确锁定，上游 2.0 正式后跟进）
whisper-rs = "=0.16.0" # ai-transcribe feature（C++/cmake 构建链，开启时才编译）
symphonia = { version = "0.5", default-features = false, features = ["pcm", "mp3", "flac", "ogg", "vorbis", "wav"] } # ai-transcribe：纯 Rust 音频解码（ADR-0017 批注；0.5 线 API 稳定口径）
# ADR-0019（M4-WP03 MCP Server 依赖批次）：rmcp = 精确锁定 2026-07-28 spec
rmcp = "=3.4.0"
# ADR-0020（M4-WP05 C2PA）：=0.90.22（0.91 需 rustc 1.96 > 钉子 1.94）；
# 关 default（openssl + 4 套 http），纯 Rust 校验栈 rust_native_crypto
c2pa = { version = "=0.90.22", default-features = false, features = ["rust_native_crypto"] }
# ADR-0024（M6-WP03 Tauri 2 桌面壳）：精确锁 patch（=2.12.0 / =2.7.0）
tauri = "=2.12.0" # 默认 features（T01 不开 protocol-asset， 见 SPEC §2 + ADR-0024 §后果）
tauri-build = "=2.7.0" # 与 tauri 2.12.0 配对（crates.io 实测， 2026-09-26 release）
# ADR-0025（M7-WP01 WASM 扩展宿主）：线位与 feature 集按 ADR-0025 决策节
# diff 原样落地（47.x MSRV=1.94 与 rust-toolchain 钉子匹配；cache 必选 =
# 冷启动预算前提，ADR-0025 后果节）
wasmtime = { version = ">=47.0.4, <48", default-features = false, features = [
    "cranelift", "component-model", "runtime", "wat", "demangle", "cache",
] }
# ADR-0026（M8-WP01 FUSE 挂载面一期）：线位按 ADR-0026 决策节（0.18 为
# 当前 max_stable，T01 查证）；macos-no-mount 供无 macFUSE/FUSE-T 环境编译
# 验证（Linux 上 build.rs 先命中 pure-rust 分支不受影响，spike 实证）。
# 安全政策：workspace forbid unsafe——fuser 0.18 内部 unsafe 与本仓无关
# （依赖边界），本 crate 自身零 unsafe。
fuser = { version = ">=0.18.0, <0.19", features = ["macos-no-mount"] }
# ADR-0030（M9-WP04 扩展签名）：minisign 线位纯验签 crate（MIT、零依赖）；
# 签名产出走 minisign CLI，不进依赖图（ADR-0027 决策 1 口径延伸）
minisign-verify = "0.3"
# ADR-0031（M10-WP05-T03 决策 4）：TLS 线位 = rustls 0.23 + tokio-rustls
# acceptor（0.23 线已在 lock 经 reqwest/iroh 同线，零新 crate，deny 实证随
# T03 载体 PR 门禁回填）；rcgen 仅 dev 证书（测试自签 fixture，0.14 已在
# lock 零新 crate；SPEC §6-R6 仓内可复现分支）。
rustls = "0.23"
tokio-rustls = "0.26"
rcgen = "0.14"
# ADR-0031（M10-WP05-T04 决策 3）：jsonwebtoken = RS 侧 access token 验签
# （JwkSet + Validation iss/aud(RFC 8707)/exp + algorithm allowlist）。
# 精确 pin =11.1.0（crates.io 2026-09-16 发布，11 线最新；本地源码查证：
# MSRV 1.88 ≤ 工具链钉子 1.94.0；MIT ∈ deny allowlist）。feature 只启
# aws_lc_rs（aws-lc-rs lock 既有 1.18.1 ≥ 源码要求 1.15.0，零新线位；全
# 算法含 EdDSA；不启 use_pem——产品/测试路径均走 JWK/DER，零 PEM）。
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs"] }

[workspace.lints.rust]
# 安全政策（执行方案 §5.2）：默认全局禁止 unsafe；确需 unsafe 的 crate 必须在
# 其自身 Cargo.toml 中以 ADR 为前提显式放宽（forbid 无法局部 allow，故放宽
# 需改用 deny 并附 ADR 编号）。
unsafe_code = "forbid"

[profile.release]
debug = 1 # 基准与线上诊断需要符号
