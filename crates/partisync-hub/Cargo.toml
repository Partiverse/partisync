[package]
name = "partisync-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hub：分片元数据(fjall)、openraft 复制、联邦路由、分层与 EC"

[dependencies]
bytes = "1" # M3-WP04-T06 iroh_channel 测试桩（ChunkSink/ChunkSource 内存实现）
fjall.workspace = true # ADR-0011
blake3.workspace = true # ADR-0002/0011：分片路由哈希（非 KDF）
partisync-core = { path = "../partisync-core", version = "0.1.0" } # 平面 ID ULID
partisync-sync = { path = "../partisync-sync", version = "0.1.0" } # D2 盐/KDF 原语 + T04 对账泛化（服务→能力层向下依赖，方向合规）
partisync-graph = { path = "../partisync-graph", version = "0.1.0" } # Merkle 叶哈希口径 + ApplyOutcome（crate 地图既定依赖）
partisync-transfer = { path = "../partisync-transfer", version = "0.1.0" } # M3-WP04-T06 iroh-blobs ChunkSink/ChunkSource trait（hub 依赖 transfer 是能力层→能力层同向依赖，方向合规）
ed25519-dalek = "3" # T05 鉴权信封验签（与 sync 同版本，M2-WP04 设备身份）
axum = { workspace = true } # hub-demo 演示面（既有 workspace 依赖，无新增顶层）
tokio = { workspace = true } # hub-demo 运行时
serde = { workspace = true } # hub-demo JSON 载荷
serde_json = { workspace = true } # hub-demo JSON 响应
openraft = { workspace = true } # ADR-0013（M3-WP02 分片复制共识）
iroh = "=1.2.0" # M3-WP04-T06 ADR-0015：hub 侧 iroh 节点（中继/打洞）+ iroh-blobs 接收/发送会话
iroh-blobs = "=0.103.0" # M4-WP04-T02：iroh-blobs 协议（handle_connection + get::fsm）；仅用 MemStore 无 fs-store 冲突
iroh-base = "=1.2.0" # M4-WP04-T02：iroh_base::EndpointAddr（download executor 参数类型）
base64 = "0.22" # M4-WP04-T02：SecretKey 序列化（Base64 编码）
tracing = "0.1" # M4-WP04-T02：iroh_channel 日志（warn/info/debug）

[dev-dependencies]
proptest = { workspace = true }

[lib]
bench = false # 无 #[bench]；阻止 cargo 为 lib 生成默认 libtest bench 目标

[[bench]]
name = "wp01" # SPEC M3-WP01 T06：10⁷ 导入 / LIST p99 / 盘上预算宏基准
harness = false

[[bench]]
name = "wp02" # SPEC M3-WP02 T07：复制导入吞吐 / failover / 转移宏基准
harness = false

[lints]
workspace = true
