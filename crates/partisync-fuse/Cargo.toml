[package]
name = "partisync-fuse"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "FUSE 挂载面（ADR-0026）：mountpoint-s3 式「诚实非 POSIX」语义——只读 + 新文件顺序写"

[lib]
name = "partisync_fuse"
path = "src/lib.rs"

[[bin]]
name = "partifuse"
path = "src/main.rs"

[dependencies]
fuser = { workspace = true }
# M8-WP07-T02（写回日志）：WAL JSONL 序列化——workspace 既有顶层依赖
# （serde 主仓多处使用），非新增顶层（铁律 8 核对通过）。
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# M8-WP07-T02：P16 重放幂等 proptest（≥1000 例）+ 临时 backing 目录。
proptest = { workspace = true }
tempfile = "3"
