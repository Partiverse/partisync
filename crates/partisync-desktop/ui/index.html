<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PartiSync Desktop</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1><span class="logo">partisync</span> 资产图谱</h1>
  <span class="sub" id="db-badge">桌面壳 · 本机</span>
</header>
<div class="wrap">
  <div id="error-region" class="error" style="display:none"></div>
  <div class="cards" id="cards"></div>

  <nav class="tabs">
    <button data-tab="browse" class="active">浏览</button>
    <button data-tab="search">搜索</button>
    <button data-tab="dups">重复内容</button>
    <button data-tab="jobs">作业</button>
    <button data-tab="ext">扩展</button>
  </nav>

  <div id="view-browse">
    <div class="crumbs" id="crumbs"></div>
    <table>
      <thead><tr><th style="width:36px"></th><th>名称</th><th style="width:110px">大小</th>
        <th style="width:170px">修改时间</th><th>内容身份</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div id="view-search" style="display:none">
    <div class="searchbar">
      <input id="q" placeholder="BM25 全文检索（如 png、report、f3…）">
      <button onclick="doSearch()">搜索</button>
    </div>
    <table><thead><tr><th style="width:90px">内容</th><th>命中片段</th><th style="width:90px">分数</th></tr></thead>
      <tbody id="srows"></tbody></table>
  </div>

  <div id="view-dups" style="display:none"></div>
  <div id="view-jobs" style="display:none"></div>

  <div id="view-ext" style="display:none">
    <div class="ext-head">
      <span class="sub">WASM 扩展工具（沙箱内运行，JSON 进 / JSON 出）· 来源目录 ~/.partisync/extensions</span>
      <button onclick="loadExtTools()">刷新</button>
    </div>
    <div id="ext-list"></div>
    <div id="ext-call" style="display:none">
      <div class="ext-head"><b id="ext-call-name"></b>
        <span class="badge">source: extension</span></div>
      <div class="searchbar">
        <input id="ext-input" placeholder='JSON 入参，如 {"k":"v"}'>
        <button onclick="doExtCall()">调用</button>
      </div>
      <pre id="ext-output" class="ext-out">（结果）</pre>
    </div>
  </div>

  <footer>PartiSync Desktop · M6-WP03 · 内容身份 = BLAKE3 · IPC 7 commands（T03）+ 扩展面板（M7-WP01-T04）</footer>
</div>
<script src="app-main.js"></script>
</body>
</html>
