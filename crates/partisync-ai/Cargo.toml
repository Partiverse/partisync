[package]
name = "partisync-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AI 层：fastembed/whisper 推理、MCP server(rmcp)、数据集出口、C2PA"

[features]
default = []
# ADR-0017：重推理栈 feature 门控（默认关，避免 workspace 全员背负构建链/体积）
ai-ocr = ["dep:ort"]
ai-embed = ["dep:fastembed"]
ai-transcribe = ["dep:whisper-rs", "dep:symphonia"]

[dependencies]
partisync-core = { path = "../partisync-core", version = "0.1.0" }
partisync-graph = { path = "../partisync-graph", version = "0.1.0" }
tokio = { workspace = true }
sqlx = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true } # ADR-0002：模型清单 blake3 钉版校验（models.rs）
image = { workspace = true }
kamadak-exif = { workspace = true }
ort = { workspace = true, optional = true }
fastembed = { workspace = true, optional = true }
whisper-rs = { workspace = true, optional = true }
symphonia = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
# e2e（T06）：scan→入队→管线全链走真 indexer
partisync-cas = { path = "../partisync-cas", version = "0.1.0" }

[lints]
workspace = true
