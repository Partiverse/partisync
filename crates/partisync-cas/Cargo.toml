[package]
name = "partisync-cas"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "内容仓库：fastcdc 分块、BLAKE3、块库、pack 打包、分代 GC"

[dependencies]
partisync-core = { path = "../partisync-core", version = "0.1.0" }
blake3 = { workspace = true } # ADR-0002：内容寻址主哈希
fastcdc = { workspace = true } # ADR-0004：内容定义分块
sqlx = { workspace = true } # ADR-0004：块索引（引用计数）复用 L0 引擎
tokio = { workspace = true }  # ADR-0002：spawn_blocking 文件哈希
serde = { workspace = true }   # ADR-0002：CasStats 序列化
serde_json = { workspace = true } # pack v2 索引行序列化
reed-solomon-erasure = "6"    # ADR-0014：RS(10,4) 纠删（纯 safe）
fjall = { workspace = true } # ADR-0011：修复队列持久化（m-pack-repair keyspace）

[dev-dependencies]
proptest = { workspace = true }
loom = "0.7" # M3-WP04-T05 GC：loom 验证「持续写入+并发 GC」一轮不死锁、不丢块

[lints.rust]
# 复述工作区强制的 forbid（partisync-cas 不另开 unsafe）：
unsafe_code = "forbid"
