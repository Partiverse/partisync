[package]
name = "partisync-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "同步引擎：域分离 oplog、收敛性（P6）、Merkle 对账、bisync"

[dependencies]
partisync-core = { path = "../partisync-core" }
partisync-graph = { path = "../partisync-graph" }
serde_json = { workspace = true }
blake3 = { workspace = true } # M2-WP03 reconcile.rs 桶哈希（与 graph merkle.rs 同源）
bip39 = "3" # M2-WP04 助记词词表（RustCrypto 生态）
x25519-dalek = { version = "3", features = ["static_secrets"] } # M2-WP04 ECDH 配对
ed25519-dalek = "3" # M2-WP04 设备身份签名（确定性 from_bytes，不需 rand_core）
zeroize = { version = "1", features = ["zeroize_derive"] } # M2-WP04/WP07 密钥内存擦除
getrandom = "0.4" # M2-WP04 X25519 私钥随机源（与 workspace 0.2 共存；非顶层依赖）
chacha20poly1305 = "0.11" # M2-WP07 XChaCha20-Poly1305 AEAD（ADR-0010 选型）
argon2 = "0.6" # M2-WP07 主密钥 KDF（ADR-0010 选型）

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
