[package]
name = "partisync-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "对外网关：FUSE、S3 端点、WebDAV、FTPS、SFTP、MCP Server"

[lints]
workspace = true

[dependencies]
partisync-index = { path = "../partisync-index", version = "0.1.0" }
partisync-ai = { path = "../partisync-ai", version = "0.1.0" }
partisync-core = { path = "../partisync-core", version = "0.1.0" }
# M7-WP01-T04（扩展系统接线）：ExtRegistry/ExtTool 高层封装 + IndexRead
# trait。path-only（ADR-0024 修订 5 判例）；wasmtime 依赖不出 ext-host 边界。
partisync-ext-host = { path = "../partisync-ext-host", version = "0.1.0" }
# M8-WP01-T02（FUSE 挂载面组装）：挂载 bin。path-only（同上判例）；
# fuser 依赖不出 partisync-fuse 边界（ADR-0026）。
partisync-fuse = { path = "../partisync-fuse", version = "0.1.0" }
# M8-WP07-T04（by-hash）：gateway bin 装配 ChunkStore（--cas）——workspace
# 既有依赖（铁律 8 核对通过）。
partisync-cas = { path = "../partisync-cas", version = "0.1.0" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
sqlx = { workspace = true }
rmcp = { workspace = true, features = ["server", "transport-io"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
dirs = "5"

[dev-dependencies]
tempfile = "3"
# e2e 测试用 client 侧（serve_client/RoleClient + TokioChildProcess）
rmcp = { workspace = true, features = ["client", "transport-child-process"] }

# windows: use server-side-http transport instead of stdio
[target.'cfg(target_family = "windows")'.dependencies]
rmcp = { workspace = true, features = ["server", "server-side-http"] }

