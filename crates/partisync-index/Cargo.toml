[package]
name = "partisync-index"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "检索引擎：tantivy 全文 + usearch 向量 + sidecar 管线调度"

[features]
default = []
# ADR-0018：reranker/embedding 推理 feature 门控（默认关，避免 CI 全员背负模型下载）
index-rerank = ["dep:fastembed"]
index-embed = ["dep:fastembed"]

[dependencies]
partisync-core = { path = "../partisync-core", version = "0.1.0" }
partisync-graph = { path = "../partisync-graph", version = "0.1.0" }
tantivy = { workspace = true }
usearch = { workspace = true }
byteorder = { workspace = true }
async-trait = { workspace = true }
dirs = { workspace = true }
blake3 = { workspace = true } # vector.rs content_id → u64 key 映射
sqlx = { workspace = true } # writer.rs SidecarReader 读 sidecar_items（缺声明系 WP02-T02 遗漏，T06 未编译验证所致）
# reranker 和 embed 模型走同一 fastembed 族（ADR-0018 批次）
fastembed = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
criterion = { workspace = true }
partisync-ai = { path = "../partisync-ai", version = "0.1.0" }
tokio = { workspace = true } # #[tokio::test]（engine/hybrid 测试）


[lints]
workspace = true
