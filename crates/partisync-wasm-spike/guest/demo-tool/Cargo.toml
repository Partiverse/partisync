[package]
name = "demo-tool"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = "0.62.0"

[profile.release]
# 纯工具 guest 用 wasm32-unknown-unknown 构建（零 wasi import）：
# wasip2 目标的 std 会保留 wasi:io/poll 等环境 import，破坏「默认拒权下可实例化」对照；
# panic=abort 去 unwind。
panic = "abort"
