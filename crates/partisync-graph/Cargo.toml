[package]
name = "partisync-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PartiGraph 资产图谱：Entry/ContentIdentity/Tag DAG/Sidecar + SQLite/redb 仓储 + oplog"

[dependencies]
partisync-core = { path = "../partisync-core", version = "0.2.0" }
partisync-cas = { path = "../partisync-cas", version = "0.2.0" } # ADR-0002 同层裁定：内容身份需要哈希
partisync-provider = { path = "../partisync-provider", version = "0.2.0" } # ADR-0007 同层裁定：远端索引缝合点
sqlx = { workspace = true }
walkdir = { workspace = true }
notify = { workspace = true } # ADR-0005：文件事件源
blake3 = { workspace = true } # M2-WP03 merkle.rs 状态叶哈希
serde_json = { workspace = true } # M9-WP02 memory canonical JSON + oplog payload
tokio = { workspace = true }
serde = { workspace = true }
# M11-WP06-T03：记忆域向量通道（SPEC M11-WP06 §2.1；ADR-0035 决策 1/5——
# 依赖图新边登记，usearch 为 workspace 既有顶层 pin Cargo.toml:53，非新
# 顶层依赖，deny.toml 零变更；此前仅 partisync-index 引用）
usearch = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
